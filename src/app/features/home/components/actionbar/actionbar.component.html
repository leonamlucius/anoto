<div
  class="actionbar"
  [class.active]="actionbarActive == true"
  [class.exiting]="exiting"
>
  <div class="actionbar-left">
    <button class="actionbar-button" (click)="closeActionbar()">
      <span class="material-symbols-outlined"> close </span>
    </button>

    <p>{{ regularizeText(numberSelected) }}</p>
  </div>

  <div class="actionbar-right">
    <button (pointerup)="createModalDelete(); $event.stopPropagation()">
      <span class="material-symbols-outlined">delete </span>
      <p>Excluir</p>
    </button>

    <button (pointerup)="fixNote(); $event.stopPropagation()">
      <span class="material-symbols-outlined"> keep</span>
      <p>Fixar</p>
    </button>
  </div>
</div>

@if (noteService.showDeleteModal$ | async) {
  <app-delete (closeModal)="noteService.setShowDeleteModal(false)"></app-delete>
}
