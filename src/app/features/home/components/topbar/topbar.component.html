<div class="topbar-left" [class.inactive]="searchService.getActiveSearch()">
  <app-title></app-title>

  @if (progressActivityVisible) {
    <span class="material-symbols-outlined"> progress_activity </span>
  }
</div>

<div class="topbar-right" [class.active]="searchService.getActiveSearch()">
  <app-search></app-search>
  @if ((userDropdownService.showDropdown$ | async) == false) {
    <app-profile
      (click)="showUserDropdown()"
      class="profile-component"
      [style.view-transition-name]="
        (userDropdownService.showDropdown$ | async) === false &&
        (noteService.showOtherView$ | async) === true
          ? 'profile'
          : 'none'
      "
    ></app-profile>
  }
  <app-user-dropdown></app-user-dropdown>
</div>
