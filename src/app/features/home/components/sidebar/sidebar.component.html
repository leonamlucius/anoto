<app-add class="add-component"></app-add>
@if ((userDropdownService.showDropdown$ | async) == false) {
  <app-profile
    class="profile-component"
    [style.view-transition-name]="
      (userDropdownService.showDropdown$ | async) === false ? 'profile' : 'none'
    "
    (click)="showUserDropdown()"
  ></app-profile>
}
<div class="colors">
  @for (color of colors; track color) {
    <button
      class="note"
      [style.backgroundColor]="color.color"
      (click)="selectNote($event)"
      [class.active]="(noteService.selectedColor$ | async) === color.color"
      id="{{ color.color }}"
    ></button>
  }
</div>

<button
  type="button"
  (click)="logout()"
  class="back"
  title="Voltar para o login"
>
  <span class="material-symbols-outlined"> arrow_back </span>
</button>
