<app-add class="add-component"></app-add>
<app-profile class="profile-component"></app-profile>
<div class="colors">
  @for (color of colors; track color) {
    <button
      class="note"
      [style.backgroundColor]="color.color"
      (click)="selectNote($event)"
      [class.active]="(noteService.selectedColor$ | async) === color.color"
      id="{{ color.color }}"
    ></button>
  }
</div>

<button
  type="button"
  routerLink="/login"
  class="back"
  title="Voltar para o login"
>
  <span class="material-symbols-outlined"> arrow_back </span>
</button>
