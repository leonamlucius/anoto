<div class="modal-create">
  <div class="modal-content">
    <p>Deseja excluir os itens selecionados?</p>
    <div class="buttons">

      <button class="cancel-button" (click)="close()">
        <span class="material-symbols-outlined">
          close
        </span>
      </button>
      <button class="delete-button" (click)="delete()" [class.disabled]="isLoading">
        @if (!isLoading) {
          <span class="material-symbols-outlined">
            chevron_forward
          </span>
        }
        @if (isLoading) {
          <span class="material-symbols-outlined" id="loading" >
            progress_activity
          </span>
        }
      </button>
    </div>
  </div>

</div>
