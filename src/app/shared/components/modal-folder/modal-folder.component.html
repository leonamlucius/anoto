@if (showModal) {
  <div class="modal-folder">
    <div class="modal-content">
      <div class="modal-header">
        <button (click)="closeModal()">
          <span class="material-symbols-outlined"> close </span>
        </button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="submitFolder(title.value, description.value)">
          <input #title type="text" placeholder="Digite o nome da pasta" />
          <textarea
            #description
            placeholder="Digite a descrição da pasta"
          ></textarea>

          <div class="color-options">
            @for (color of colors; track $index) {
              <div
                class="color-option"
                [style.background]="color.color"
                (click)="selectColor(color.color)"
              >
                @if (color.color === selectedColor) {
                  <div class="check">
                    <span
                      class="material-symbols-outlined"
                      [style.color]="color.color"
                    >
                      check
                    </span>
                  </div>
                }
              </div>
            }
          </div>

          <div
            class="notes-header"
            (click)="toggleActiveNotes(); $event.preventDefault()"
          >
            <p>Selecione as notas</p>

            <button>
              <span class="material-symbols-outlined" [class.active]="activeNotes"> keyboard_arrow_up </span>
            </button>
          </div>
          <div class="notes" [class.active]="activeNotes">
            @for (
              note of noteService.allNotesObservable$ | async;
              track $index
            ) {
              <div
                class="note"
                [style.background]="note.color"
                (click)="selectNote(note)"
              >
                {{ note.title }}

                @if (selectedNote.includes(note.id)) {
                  <div class="check">
                    <span
                      class="material-symbols-outlined"
                      [style.color]="note.color"
                    >
                      check
                    </span>
                  </div>
                }
              </div>
            }
          </div>

          <div class="modal-footer">
            <button
              type="submit"
              class="btn btn-primary"
              [class.disabled]="isLoading"
            >
              @if (isLoading) {
                <span class="material-symbols-outlined" id="loading">
                  progress_activity
                </span>
              }

              @if (!isLoading) {
                <span class="material-symbols-outlined"> chevron_forward </span>
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
